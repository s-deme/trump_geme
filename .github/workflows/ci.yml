name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ripgrep
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep --no-progress -y

      - name: Build
        run: dotnet build TrumpGameLab.sln -m:1

      - name: Test
        run: dotnet test tests/TrumpLab.Tests

      - name: Verify migration (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-migration.ps1

      - name: Verify migration (Bash)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-migration.sh
