name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep --no-progress -y

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Build
        run: dotnet build TrumpGameLab.sln -m:1

      - name: Test
        run: dotnet test tests/TrumpLab.Tests

      - name: Verify migration (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-migration.ps1

      - name: Verify migration (Bash)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-migration.sh
